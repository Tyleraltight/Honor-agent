<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Honor Agent - System Architecture Diagram</title>
  <desc id="arch-desc">Four-layer decoupled architecture: Trigger Layer, Core Orchestrator, Risk-Tiered Guardrails, and OS Tooling.</desc>

  <defs>
    <linearGradient id="layer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b"/>
      <stop offset="100%" stop-color="#161c26"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97757"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 8 L 9 0 z" fill="#d97757"/>
    </marker>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="440" rx="18" fill="url(#layer-bg)" stroke="#2d333b" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g transform="translate(48, 32)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">SYSTEM ARCHITECTURE</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#8b949e">Decoupled Headless Core · Risk-Tiered Defense · Multi-Channel Mobility</text>
  </g>

  <!-- Layer 1: Trigger & Interface Layer -->
  <g transform="translate(48, 80)">
    <rect width="1104" height="64" rx="10" fill="#1b212c" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="64" rx="10" fill="#252d3d"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#d97757">LAYER 1</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">TRIGGER / UI</text>

    <!-- Client 1: Desktop Spotlight -->
    <g transform="translate(180, 12)">
      <rect width="420" height="40" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#d97757"/>
      <text x="28" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Desktop Spotlight UI</text>
      <text x="175" y="24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#8b949e">pywebview + launcher.ahk (F11 / ^+Space)</text>
    </g>

    <!-- Client 2: Remote Bot Gateway -->
    <g transform="translate(620, 12)">
      <rect width="460" height="40" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#58a6ff"/>
      <text x="28" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Remote Bot Gateway</text>
      <text x="180" y="24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#8b949e">bot_gateway.py (Async Queue + --mock)</text>
    </g>
  </g>

  <!-- Arrow L1 -> L2 -->
  <line x1="600" y1="144" x2="600" y2="162" stroke="#d97757" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- Layer 2: Orchestration & Core Runner -->
  <g transform="translate(48, 166)">
    <rect width="1104" height="74" rx="10" fill="#1b212c" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="74" rx="10" fill="#252d3d"/>
    <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#d97757">LAYER 2</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">ORCHESTRATOR</text>

    <!-- Core Runner Modules -->
    <g transform="translate(180, 14)">
      <rect width="280" height="46" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">core.agent_runner.AgentRunner</text>
      <text x="16" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8b949e">Headless Event Dispatcher</text>
    </g>

    <g transform="translate(480, 14)">
      <rect width="280" height="46" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">LLM Streaming &amp; Tool Calling</text>
      <text x="16" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8b949e">Xiaomi mimo-v2.5 / Anthropic API</text>
    </g>

    <g transform="translate(780, 14)">
      <rect width="300" height="46" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Memory &amp; Context Hydration</text>
      <text x="16" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8b949e">SOUL.md / MEMORY.md / USER.md</text>
    </g>
  </g>

  <!-- Arrow L2 -> L3 -->
  <line x1="600" y1="240" x2="600" y2="258" stroke="#d97757" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- Layer 3: Security & Guardrails -->
  <g transform="translate(48, 262)">
    <rect width="1104" height="74" rx="10" fill="#1b212c" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="74" rx="10" fill="#252d3d"/>
    <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#d97757">LAYER 3</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">GUARDRAILS</text>

    <!-- Guardrail Tiers -->
    <g transform="translate(180, 14)">
      <rect width="280" height="46" rx="6" fill="#12171f" stroke="#238636" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#3fb950">TIER 1: READ / QUERY</text>
      <text x="14" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8b949e">Blocks traversal: ..\Windows, .ssh</text>
    </g>

    <g transform="translate(480, 14)">
      <rect width="280" height="46" rx="6" fill="#12171f" stroke="#d29922" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e3b341">TIER 2: CONTROLLED WRITE</text>
      <text x="14" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8b949e">Sandboxed workspace boundaries</text>
    </g>

    <g transform="translate(780, 14)">
      <rect width="300" height="46" rx="6" fill="#12171f" stroke="#da3633" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f85149">TIER 3: COMMAND WHITELIST</text>
      <text x="14" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#8b949e">Interception: format, rmdir /s, del /s</text>
    </g>
  </g>

  <!-- Arrow L3 -> L4 -->
  <line x1="600" y1="336" x2="600" y2="354" stroke="#d97757" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- Layer 4: Execution & Tooling -->
  <g transform="translate(48, 358)">
    <rect width="1104" height="60" rx="10" fill="#1b212c" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#252d3d"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#d97757">LAYER 4</text>
    <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">OS EXECUTION</text>

    <!-- Native OS Tools -->
    <g transform="translate(180, 12)">
      <rect width="210" height="36" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="23" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c9d1d9">run_command (cmd/pwsh)</text>
    </g>

    <g transform="translate(405, 12)">
      <rect width="210" height="36" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="23" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c9d1d9">read_file / write_file</text>
    </g>

    <g transform="translate(630, 12)">
      <rect width="210" height="36" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="23" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c9d1d9">list_directory / search</text>
    </g>

    <g transform="translate(855, 12)">
      <rect width="225" height="36" rx="6" fill="#12171f" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="23" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#c9d1d9">get_system_status</text>
    </g>
  </g>
</svg>
